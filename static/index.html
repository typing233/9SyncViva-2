<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncViva - 同步观影</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Lobby -->
        <div id="lobby">
            <div class="lobby-card">
                <h1>SyncViva</h1>
                <p class="subtitle">异地同步观影</p>
                <div class="form-group">
                    <input type="text" id="nickname" placeholder="昵称" maxlength="20" autocomplete="off">
                </div>
                <div class="form-group">
                    <input type="text" id="roomId" placeholder="房间号（留空自动生成）" maxlength="20" autocomplete="off">
                </div>
                <div class="form-group">
                    <input type="password" id="roomPassword" placeholder="房间密码（可选）" maxlength="32" autocomplete="off">
                </div>
                <button id="joinBtn" class="btn-primary">进入房间</button>
            </div>
        </div>

        <!-- Password Modal (for joining) -->
        <div id="passwordModal" class="modal hidden">
            <div class="modal-content">
                <h3>该房间需要密码</h3>
                <input type="password" id="modalPassword" placeholder="输入房间密码" autocomplete="off">
                <button id="modalPasswordBtn" class="btn-primary">确认</button>
                <button id="modalCancelBtn" class="btn-small">取消</button>
            </div>
        </div>

        <!-- Set Password Modal (for owner) -->
        <div id="setPasswordModal" class="modal hidden">
            <div class="modal-content">
                <h3>设置房间密码</h3>
                <input type="password" id="setPasswordInput" placeholder="输入新密码（留空则清除密码）" autocomplete="off">
                <button id="setPasswordConfirmBtn" class="btn-primary">确认</button>
                <button id="setPasswordCancelBtn" class="btn-small">取消</button>
            </div>
        </div>

        <!-- Room -->
        <div id="room" class="hidden">
            <div class="room-header">
                <span id="roomTitle" class="copyable" title="点击复制房间号">房间: ---</span>
                <span id="ownerBadge" class="owner-badge hidden">房主</span>
                <span id="memberCount">0 人在线</span>
                <select id="roomMode" class="mode-select hidden">
                    <option value="free">自由模式</option>
                    <option value="strict">房主控制</option>
                </select>
                <button id="passwordBtn" class="btn-password hidden" title="设置/清除房间密码">🔒</button>
                <button id="embyBtn" class="btn-emby hidden">Emby</button>
                <button id="leaveBtn" class="btn-small">离开</button>
            </div>
            <div class="room-body">
                <div class="player-section">
                    <div class="video-input" id="videoInputBar">
                        <input type="text" id="videoUrl" placeholder="输入视频链接（mp4/m3u8/flv 直链 或 Bilibili 链接）" autocomplete="off">
                        <label class="live-toggle" title="手动标记为直播流"><input type="checkbox" id="liveCheckbox"> 直播</label>
                        <button id="loadVideoBtn" class="btn-primary">加载</button>
                    </div>
                    <div id="playerContainer">
                        <video id="videoPlayer" controls></video>
                        <iframe id="biliPlayer" class="hidden" allowfullscreen frameborder="0"
                            allow="autoplay" sandbox="allow-scripts allow-same-origin allow-popups allow-presentation"></iframe>
                        <div id="playerPlaceholder">
                            <p>输入视频链接开始观影</p>
                        </div>
                        <div id="danmakuOverlay"></div>
                        <div id="liveBadge" class="hidden">LIVE</div>
                    </div>
                    <div id="biliControls" class="hidden">
                        <button id="biliPlayBtn" class="btn-bili">&#9654; 同步播放</button>
                        <button id="biliPauseBtn" class="btn-bili">&#9208; 同步暂停</button>
                        <span class="bili-hint">Bilibili 模式：iframe 内操作无法同步</span>
                    </div>
                    <div class="danmaku-bar">
                        <input type="text" id="danmakuText" placeholder="发弹幕..." maxlength="100" autocomplete="off">
                        <select id="danmakuColor">
                            <option value="#FFFFFF">白</option>
                            <option value="#FF0000">红</option>
                            <option value="#00FF00">绿</option>
                            <option value="#4FC3F7">蓝</option>
                            <option value="#FFEB3B">黄</option>
                            <option value="#FF69B4">粉</option>
                        </select>
                        <select id="danmakuPosition">
                            <option value="scroll">滚动</option>
                            <option value="top">顶部</option>
                            <option value="bottom">底部</option>
                        </select>
                        <button id="sendDanmakuBtn" class="btn-danmaku">发射</button>
                    </div>
                </div>
                <div class="chat-section">
                    <div id="memberList"></div>
                    <div id="chatMessages"></div>
                    <div class="chat-input">
                        <input type="text" id="chatInput" placeholder="发消息..." maxlength="500" autocomplete="off">
                        <button id="sendChatBtn">发送</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Emby Panel -->
        <div id="embyPanel" class="panel hidden">
            <div class="panel-header">
                <span>Emby 媒体库</span>
                <button id="embyCloseBtn" class="btn-small">关闭</button>
            </div>
            <div id="embyBreadcrumb" class="emby-breadcrumb"></div>
            <div id="embyItems" class="emby-list"></div>
        </div>

        <!-- Toast Container -->
        <div id="toastContainer"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/flv.js@latest/dist/flv.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
